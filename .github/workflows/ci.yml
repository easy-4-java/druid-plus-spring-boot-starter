name: CI

on:
  push:
    branches: [4.0.x]
  pull_request:
    branches: [4.0.x]

permissions:
  contents: read

jobs:
  build:
    name: JDK 21 build and verify
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure Easy4J Maven repositories
        env:
          MAVEN_SETTINGS_XML: ${{ secrets.MAVEN_SETTINGS_XML }}
        shell: bash
        run: |
          install -d -m 700 "$HOME/.m2"
          umask 077
          printf '%s' "$MAVEN_SETTINGS_XML" > "$HOME/.m2/settings.xml"

      - name: Build and verify with Maven 4 wrapper
        shell: bash
        run: |
          test -x ./mvnw
          ./mvnw -B --no-transfer-progress clean verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
          retention-days: 14
